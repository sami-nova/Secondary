<!DOCTYPE html>
<html>
<head>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Google Sans', Arial, sans-serif;
    background: #f8f9fa;
    padding: 20px;
    color: #333;
  }
  h3 { font-size: 15px; color: #4B4B9B; margin-bottom: 14px; }

  .bar-wrap {
    width: 100%; height: 16px;
    background: #e0e0e0; border-radius: 8px;
    overflow: hidden; margin-bottom: 6px;
  }
  .bar-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #4B4B9B 0%, #7B6BDB 100%);
    border-radius: 8px;
    transition: width 0.35s ease;
  }
  .pct {
    font-size: 12px; font-weight: bold;
    color: #4B4B9B; text-align: right;
    margin-bottom: 14px;
  }

  .step {
    display: flex; align-items: flex-start;
    padding: 5px 6px; margin: 3px 0;
    border-radius: 5px; font-size: 12px;
    color: #999; transition: background 0.2s;
  }
  .step .icon { width: 18px; flex-shrink: 0; font-size: 12px; margin-right: 6px; }
  .step.done    { color: #2d7a47; background: #eafaf1; }
  .step.active  { color: #3c4bc7; background: #eef0ff; font-weight: bold; }
  .step.pending { color: #aaa; }

  .err {
    margin-top: 10px; padding: 8px 10px;
    background: #fff0f0; border-left: 3px solid #e53935;
    border-radius: 4px; font-size: 11px; color: #c62828;
  }
  .done-msg {
    margin-top: 12px; padding: 10px;
    background: #eafaf1; border-radius: 5px;
    text-align: center; font-size: 13px; color: #2d7a47;
    font-weight: bold; display: none;
  }
</style>
</head>
<body>

<h3>🏗️ Initializing Sheet Structure</h3>

<div class="bar-wrap"><div class="bar-fill" id="fill"></div></div>
<div class="pct" id="pct">Starting…</div>

<div id="steps"></div>
<div id="err"></div>
<div class="done-msg" id="done">✅ Setup Complete! Sidebar closing…</div>

<script>
  var STEPS = [
    'Clear existing data (rows 15+)',
    'Write column headers',
    'Fill 168 structure rows (A – C)',
    'Apply batch colour coding',
    'Apply formatting & region borders',
    'Set up dropdowns & checkboxes',
    'Build filter navigation area',
    'Set up Reference_Data sheet'
  ];
  var PCTS = [8, 18, 32, 52, 66, 78, 90, 100];
  var current = 0;

  function render(activeIdx) {
    document.getElementById('steps').innerHTML = STEPS.map(function(s, i) {
      var cls  = i < activeIdx  ? 'step done'
               : i === activeIdx ? 'step active'
               :                   'step pending';
      var icon = i < activeIdx  ? '✅'
               : i === activeIdx ? '⏳'
               :                   '○';
      return '<div class="' + cls + '"><span class="icon">' + icon + '</span>' + s + '</div>';
    }).join('');
  }

  function advance() {
    if (current >= STEPS.length) return;
    render(current);
    document.getElementById('fill').style.width = (current === 0 ? 2 : PCTS[current - 1]) + '%';

    google.script.run
      .withSuccessHandler(function() {
        document.getElementById('fill').style.width = PCTS[current] + '%';
        document.getElementById('pct').textContent  = PCTS[current] + '%';
        current++;
        if (current >= STEPS.length) {
          render(current);
          document.getElementById('done').style.display = 'block';
          setTimeout(function() { google.script.host.close(); }, 2200);
        } else {
          setTimeout(advance, 60);
        }
      })
      .withFailureHandler(function(e) {
        render(current);
        document.getElementById('pct').textContent = 'Step ' + (current + 1) + ' failed';
        document.getElementById('err').innerHTML =
          '<div class="err">❌ <strong>Error at step ' + (current + 1) +
          ' — ' + STEPS[current] + ':</strong><br>' + e.message + '</div>';
      })
      .runSetupStep(current + 1);
  }

  advance();
</script>
</body>
</html>
